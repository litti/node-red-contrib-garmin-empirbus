<script type="text/x-red" data-help-name="empirbus-command">
<h3>Deutsch</h3>
<p>Erweiterter Node für Spezialfälle, Diagnose und Funktionen, die noch keinen eigenen EmpirBus-Node besitzen.</p>
<p>Der Node akzeptiert ausschließlich ein Rohtelegramm-Objekt in <code>msg.payload</code>. JSON-Strings und High-Level-Kurzformen werden bewusst nicht unterstützt.</p>
<p>Das Telegramm wird vor dem Senden strikt validiert. <code>size</code> darf fehlen und wird dann aus der Länge der Daten bestimmt. Zusätzliche Properties werden nicht übertragen.</p>
<p>Für normale Flows sollten <b>Switch</b>, <b>Button</b>, <b>Toggle</b> und <b>Dimmer</b> bevorzugt werden. Details zum EmpirBus-Telegrammformat gehören zur technischen Dokumentation von <code>garmin-empirbus-ts</code>.</p>
<p><b>Acknowledge</b></p>
<p>Ist Acknowledge aktiviert, wird nach erfolgreicher Übergabe eine kompatible Bestätigungsnachricht ausgegeben. Ohne Acknowledge besitzt der Node keinen Ausgang.</p>
<h3>English</h3>
<p>Advanced node for special cases, diagnostics and functions that do not yet have a dedicated EmpirBus node.</p>
<p>The node only accepts a raw telegram object in <code>msg.payload</code>. JSON strings and high-level shorthand formats are intentionally not supported.</p>
<p>The telegram is strictly validated before sending. <code>size</code> may be omitted and is then derived from the data length. Additional properties are not transmitted.</p>
<p>For normal flows prefer <b>Switch</b>, <b>Button</b>, <b>Toggle</b> and <b>Dimmer</b>. Details of the EmpirBus telegram format belong in the technical documentation of <code>garmin-empirbus-ts</code>.</p>
<p><b>Acknowledge</b></p>
<p>Acknowledge can be disabled, emitted immediately after validation/start, or emitted after successful execution.</p>
</script>
