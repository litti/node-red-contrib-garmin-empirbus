<script type="text/x-red" data-help-name="empirbus-dim">
<h3>Deutsch</h3>
<p>Setzt den Dimmwert eines oder mehrerer EmpirBus-Kanäle.</p>
<p><b>Input Mode</b></p>
<p><b>Numeric payload</b> bestimmt ausschließlich, wie nackte Zahlen interpretiert werden: <code>Percent</code> erwartet 0 bis 100, <code>Raw</code> 0 bis 1000 und <code>Normalized</code> 0.0 bis 1.0. Strukturierte HomeKit-Payloads werden unabhängig davon erkannt.</p>
<p>Explizite Werte können unabhängig vom Input Mode angegeben werden: <code>{ value: 50, unit: "percent" }</code>, <code>{ value: 128, unit: "raw" }</code> oder <code>{ value: 0.5, unit: "normalized" }</code>.</p>
<p><b>ON level</b></p>
<p>Legt den Dimmwert für <code>ON</code> fest. Das Format wird separat über die Einheit neben dem Wert gewählt. Bleibt das Feld leer, wird der Maximalwert der gewählten Einheit verwendet. <code>OFF</code> setzt immer 0.</p>
<p>Ungültige Werte werden abgelehnt und nicht still auf den erlaubten Bereich begrenzt.</p>
<p>Mehrere Kanäle werden unterstützt. Eine dynamische Channel ID kann über <code>msg.topic = "empirbus/&lt;id&gt;"</code> angegeben werden.</p>
<p><b>HomeKit</b></p>
<p><code>{ Brightness: 0..100 }</code> wird immer als Prozentwert interpretiert, unabhängig vom gewählten Input-Format. <code>{ On: true }</code> verwendet den konfigurierten ON-Level, <code>{ On: false }</code> setzt auf 0.</p>
<p><b>Alexa</b></p>
<p>Wenn Alexa Helligkeitswerte als nackte Zahl von 0 bis 100 liefert, wähle <code>Percent</code>. HomeKit <code>{ Brightness: 0..100 }</code> wird immer als Prozent interpretiert.</p>
<p><b>Acknowledge</b></p>
<p>Acknowledge kann deaktiviert, sofort nach erfolgreicher Validierung/Start oder nach erfolgreicher Ausführung gesendet werden.</p>
<h3>English</h3>
<p>Sets the dimming level of one or more EmpirBus channels.</p>
<p><b>Input Mode</b></p>
<p><b>Numeric payload</b> controls only how plain numeric payloads are interpreted: <code>Percent</code> expects 0 to 100, <code>Raw</code> 0 to 1000, and <code>Normalized</code> 0.0 to 1.0. Structured HomeKit payloads are detected independently.</p>
<p>Explicit values can be supplied independently of the input mode: <code>{ value: 50, unit: "percent" }</code>, <code>{ value: 128, unit: "raw" }</code>, or <code>{ value: 0.5, unit: "normalized" }</code>.</p>
<p><b>ON level</b></p>
<p>Defines the dimming value sent for <code>ON</code>. Its unit is selected independently next to the value. If left empty, the maximum value of the selected unit is used. <code>OFF</code> always sets 0.</p>
<p>Invalid values are rejected and are not silently clamped.</p>
<p>Multiple channels are supported. A dynamic channel ID can be supplied with <code>msg.topic = "empirbus/&lt;id&gt;"</code>.</p>
<p><b>HomeKit</b></p>
<p><code>{ Brightness: 0..100 }</code> is always interpreted as percent, independent of the selected input format. <code>{ On: true }</code> uses the configured ON level and <code>{ On: false }</code> sets 0.</p>
<p><b>Alexa</b></p>
<p>When Alexa provides brightness as a plain number from 0 to 100, select <code>Percent</code>. HomeKit <code>{ Brightness: 0..100 }</code> is always interpreted as percent.</p>
<p><b>Acknowledge</b></p>
<p>Acknowledge can be disabled, emitted immediately after successful validation/start, or emitted after successful execution.</p>
</script>
