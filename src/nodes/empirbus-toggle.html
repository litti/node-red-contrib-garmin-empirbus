<div class="form-row empirbus-row"><label for="node-input-channelId">Channel ID</label><input id="node-input-channelId" type="number"></div>
<div class="form-row empirbus-row"><label for="node-input-channelName">Channel Name</label><input id="node-input-channelName" type="text"></div>
<div class="form-row empirbus-row"><label for="node-input-acknowledge"><i class="fa fa-check"></i> Acknowledge</label><div class="empirbus-input-wrapper"><input id="node-input-acknowledge" type="checkbox" style="width:auto"><span class="help">Adds <code>acknowledge:true</code> and enables the output.</span></div></div>

<script type="text/x-red" data-help-name="empirbus-toggle">
<h3>Deutsch</h3>
<p>Kehrt den zuletzt bekannten Ein-/Aus-Zustand eines oder mehrerer EmpirBus-Kanäle um.</p>
<p>Der Node benötigt dafür einen bekannten Status aus dem Repository. Ist für mindestens einen ausgewählten Kanal noch kein Zustand bekannt, wird kein Kanal geschaltet und ein Fehler gemeldet.</p>
<p>Mehrere Kanäle werden unterstützt. Eine dynamische Channel ID kann über <code>msg.topic = "empirbus/&lt;id&gt;"</code> angegeben werden.</p>
<p>Für einen expliziten Zielzustand sollte <b>EmpirBus Switch</b> verwendet werden.</p>
<p><b>Acknowledge</b></p>
<p>Ist Acknowledge aktiviert, wird nach erfolgreichem Umschalten eine kompatible Bestätigungsnachricht ausgegeben. Ohne Acknowledge besitzt der Node keinen Ausgang.</p>
<h3>English</h3>
<p>Inverts the last known on/off state of one or more EmpirBus channels.</p>
<p>The node requires a known repository state. If at least one selected channel has no known state yet, no channel is changed and an error is reported.</p>
<p>Multiple channels are supported. A dynamic channel ID can be supplied with <code>msg.topic = "empirbus/&lt;id&gt;"</code>.</p>
<p>Use <b>EmpirBus Switch</b> when an explicit target state is required.</p>
<p><b>Acknowledge</b></p>
<p>When enabled, a compatible acknowledgement message is emitted after a successful toggle. Without acknowledgement the node has no output.</p>
</script>
