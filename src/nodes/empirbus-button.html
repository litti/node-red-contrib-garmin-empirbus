<script type="text/x-red" data-help-name="empirbus-button">
<h3>Deutsch</h3>
<p>Entspricht einem <b>Button / SendMomentary</b> in der Garmin-Original-UI. Der Node bildet einen Tastendruck mit getrenntem Drücken und Loslassen ab.</p>
<p><b>Short Press</b></p>
<p>Jede Eingangsnachricht erzeugt einen kurzen Tastendruck: drücken, 150 ms warten, loslassen.</p>
<p><b>Long Press</b></p>
<p>Jede Eingangsnachricht erzeugt einen langen Tastendruck. Die Dauer ist zwischen 10 und 60000 ms einstellbar.</p>
<p><b>Direct</b></p>
<p>Der Flow steuert Drücken und Loslassen selbst. Bevorzugt werden <code>PRESS</code> und <code>RELEASE</code>, jeweils unabhängig von Groß-/Kleinschreibung. Zusätzlich werden <code>ON</code>/<code>OFF</code>, <code>true</code>/<code>false</code> und <code>1</code>/<code>0</code> unterstützt.</p>
<p><b>Mehrere Kanäle</b></p>
<p><code>Sequential</code> verarbeitet jeden Kanal vollständig nacheinander und ist der Standard. <code>Parallel</code> sendet zunächst Press an alle Kanäle, wartet und sendet danach Release an alle Kanäle. Bei Sequential kann zwischen den Kanälen eine Pause von 0 bis 1000 ms eingestellt werden; Standard sind 5 ms.</p>
<p>Während Short Press oder Long Press läuft, werden weitere Trigger ignoriert.</p>
<p><b>HomeKit</b></p>
<p>Im Modus <code>Direct</code> entspricht <code>{ On: true }</code> PRESS und <code>{ On: false }</code> RELEASE.</p>
<p><b>Acknowledge</b></p>
<p>Acknowledge kann deaktiviert, sofort nach erfolgreicher Validierung beim Start der Ausführung oder erst nach erfolgreichem Abschluss ausgegeben werden. „Sofort“ bestätigt die Annahme des Befehls, nicht eine vom EmpirBus bestätigte Zustandsänderung.</p>
<h3>English</h3>
<p>Equivalent to a <b>Button / SendMomentary</b> in the original Garmin UI. It models a button action with separate press and release operations.</p>
<p><b>Short Press</b></p>
<p>Each input message performs a short press: press, wait 150 ms, release.</p>
<p><b>Long Press</b></p>
<p>Each input message performs a long press. Duration is configurable from 10 to 60000 ms.</p>
<p><b>Direct</b></p>
<p>The flow controls press and release itself. Preferred values are case-insensitive <code>PRESS</code> and <code>RELEASE</code>. <code>ON</code>/<code>OFF</code>, <code>true</code>/<code>false</code> and <code>1</code>/<code>0</code> are also supported.</p>
<p><b>Multiple channels</b></p>
<p><code>Sequential</code> completes each channel one after another and is the default. <code>Parallel</code> sends press to all channels first, waits, then releases all channels. Sequential execution supports a configurable 0 to 1000 ms inter-channel delay; the default is 5 ms.</p>
<p>Additional triggers are ignored while a short or long press is running.</p>
<p><b>HomeKit</b></p>
<p>In <code>Direct</code> mode, <code>{ On: true }</code> means PRESS and <code>{ On: false }</code> means RELEASE.</p>
<p><b>Acknowledge</b></p>
<p>Acknowledge can be disabled, emitted immediately after validation/start, or emitted after successful execution.</p>
</script>
