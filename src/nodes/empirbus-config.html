<script type="text/x-red" data-template-name="empirbus-config">
    <div class="form-row">
      <label for="node-config-input-name">
        <i class="fa fa-tag"></i> Name
      </label>
      <input type="text" id="node-config-input-name">
    </div>

    <div class="form-row">
      <label for="node-config-input-url">
        <i class="fa fa-globe"></i> WebSocket URL, e. g. ws://192.168.1.1:8888/ws or ws://http://172.16.11.7:8888/ws
      </label>
      <input type="text" id="node-config-input-url" placeholder="ws://192.168.1.1:8888/ws or ws://http://172.16.11.7:8888/ws">
    </div>
</script>

<script type="text/javascript">
    /* global RED */
    RED.nodes.registerType('empirbus-config', {
        category: 'config',
        icon: 'empirbus-config.svg',
        defaults: {
            name: { value: '' },
            url: { value: '', required: true }
        },
        label() {
            if (this.name) return this.name
            if (this.url) return this.url
            return 'empirbus-config'
        }
    })
</script>

<script type="text/x-red" data-help-name="empirbus-config">
<h3>Deutsch</h3>
<p>Stellt die gemeinsame Verbindung zu einer Garmin EmpirBus MCU oder einem Garmin Serv7 Display bereit.</p>
<p><b>Konfiguration</b></p>
<p>Trage die WebSocket-URL des Garmin-Geräts ein. Alle anderen EmpirBus-Nodes verwenden diesen Config-Node gemeinsam.</p>
<p>Wenn im Flow genau eine EmpirBus-Konfiguration vorhanden ist, wird sie bei neu hinzugefügten EmpirBus-Nodes automatisch verwendet.</p>
<h3>English</h3>
<p>Provides the shared connection to a Garmin EmpirBus MCU or Garmin Serv7 display.</p>
<p><b>Configuration</b></p>
<p>Enter the WebSocket URL of the Garmin device. All other EmpirBus nodes share this config node.</p>
<p>If exactly one EmpirBus configuration exists in the flow, newly added EmpirBus nodes use it automatically.</p>
</script>
